# ==============================================================================
# Nginx Configuration: trade-client.conf
# Domain: tradie-client-backend.omnisutieai.com www.tradie-client-backend.omnisutieai.com
# Target: NestJS API Backend running on port 4050 via PM2
# ==============================================================================

# Upstream pool pointing to local NestJS process
upstream trade_client_backend {
    server 127.0.0.1:4050 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80)
# Handles Let's Encrypt validation and proxies traffic or redirects to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tradie-client-backend.omnisutieai.com www.tradie-client-backend.omnisutieai.com;

    # Let's Encrypt ACME Challenge Directory for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Logging
    access_log /var/log/nginx/trade-client.access.log;
    error_log /var/log/nginx/trade-client.error.log warn;

    # Client payload size (supports file uploads / large catalog requests)
    client_max_body_size 50M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint (bypasses heavy logging if desired)
    location /health {
        proxy_pass http://trade_client_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main API reverse proxy
    location / {
        proxy_pass http://trade_client_backend;
        proxy_http_version 1.1;

        # WebSocket / Keep-Alive headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Proxy buffer optimization
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # NOTE: After obtaining your SSL certificate with Certbot:
    # Run: sudo certbot --nginx -d tradie-client-backend.omnisutieai.com -d www.tradie-client-backend.omnisutieai.com
    # Certbot will automatically configure the SSL server block below and add HTTP->HTTPS redirect.
}

